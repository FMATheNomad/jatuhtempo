[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jatuhtempo"
version = "0.1.0"
description = "AI-powered debt management assistant for Indonesian users"
license = { text = "All Rights Reserved" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.32.0",
    "aiogram>=3.28.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "apscheduler>=3.10.4",
    "pytesseract>=0.3.13",
    "Pillow>=11.0.0",
    "pyjwt>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.18",
    "cryptography>=48.0.0",
    "polar-sdk>=0.20.0",
]

[project.scripts]
jatuhtempo = "uvicorn:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
